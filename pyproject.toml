[project]
name = "backend"
version = "0.1.0"
description = ""
packages = [{ include = "backend" }]
authors = [
    {name = "Marllon Campos",email = "marllon@alfasense.com.br"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "flask (>=3.1.1,<4.0.0)",
    "flask-cors (>=6.0.0,<7.0.0)",
    "marshmallow (>=4.0.0,<5.0.0)",
    "flask-smorest (>=0.46.1,<0.47.0)",
    "marshmallow-sqlalchemy (>=1.4.2,<2.0.0)",
    "mypy (>=1.16.1,<2.0.0)",
    "alembic (>=1.16.2,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
]


[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
taskipy = "^1.14.1"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations', 'frontend', 'backend/migrations']

[tool.ruff.lint]
preview = true
select = ['I','F','E','W', 'PL', 'PT']
ignore = ["PLR6301"]

[tool.ruff.format]
preview = true
quote-style = 'single'


[tool.pytest.ini_options]
pythonpath="backend"
addopts = "-p no:warnings"


[tool.taskipy.tasks]
lint = 'ruff check backend'
pre_format = 'ruff check backend --fix ' # Executa antes do format, caso de certo roda o format
format = 'ruff format backend'
run = 'flask --app backend/wsgi.py run -h 0.0.0.0 -p 5000 --debug'
pre_test = 'task lint' # Executa antes do test, caso de certo roda o test
test = 'pytest -s -x --cov=backend -vv'
post_test = 'coverage html' # Executa caso o test funcione
requirements = "poetry export --without-hashes -f requirements.txt | sed 's/;.*//' > backend/requirements.txt"
