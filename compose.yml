services:
  frontend:
    build:
      context: ./react-draw-lines
      dockerfile: Dockerfile.dev
    container_name: react-frontend
    ports:
      - 3000:3000
    networks:
      - maps
    volumes:
      - ./react-draw-lines:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:5000
    command: npm start

  backend:
    build:
      context: ./Maps-FlaskAPI
    container_name: flask-backend
    ports:
      - 5000:5000
    networks:
      - maps
    volumes:
      - ./Maps-FlaskAPI:/app
    command: flask run -h 0.0.0.0 -p 5000 --debug

networks:
  maps:
    driver: bridge
