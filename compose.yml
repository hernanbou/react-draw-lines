services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mapas-frontend
    ports:
      - 3000:3000
    networks:
      - maps
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:5000
    command: npm start

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mapas-backend
    ports:
      - 5000:5000
    networks:
      - maps
    volumes:
      - ./backend:/app/backend
      - /mnt/SDCARD/maps.db:/app/backend/database/maps.db
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///backend/database/maps.db
    command: flask run -h 0.0.0.0 -p 5000 --debug

networks:
  maps:
    driver: bridge
